# Render Blueprint: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hardlyfunny
    runtime: static
    buildCommand: pip install -r requirements.txt && python -m hardlyfunny build
    staticPublishPath: _site
    # Only deploy commits whose GitHub checks (the CI tests) passed.
    autoDeployTrigger: checksPass
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /images/*
        name: Cache-Control
        value: public, max-age=604800
      - path: /site.css
        name: Cache-Control
        value: public, max-age=31536000, immutable  # pages link it with a ?v=<hash>
      - path: /site.js
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /fonts/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /feed.xml
        name: Content-Type
        value: application/atom+xml; charset=utf-8
