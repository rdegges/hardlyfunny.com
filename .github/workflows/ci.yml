name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q
      - run: python -m hardlyfunny build

  deploy:
    # Branch protection isn't available on this plan, so `needs: test` is what keeps a red build off the live site.
    needs: test
    runs-on: ubuntu-26.04
    concurrency:
      group: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'deploy-production' || format('deploy-dry-run-{0}', github.ref) }}
      cancel-in-progress: false
    env:
      CF_SEND_TELEMETRY: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt
      - run: python -m hardlyfunny build
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: lts/*
          cache: npm
      - run: npm ci
      - if: github.event_name == 'pull_request'
        run: npx cf deploy --dry-run
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: npx cf deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  verify:
    # Proves the live domain serves this build. The suite skips itself without a URL, so the
    # last step fails the job unless tests actually ran.
    needs: deploy
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    concurrency:
      group: verify-production
      cancel-in-progress: true
    env:
      HARDLYFUNNY_RUNTIME_URL: https://hardlyfunny.com
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests/test_cloudflare_runtime.py tests/test_live_domain.py --junitxml=verify.xml
      - name: Fail unless the live tests ran
        run: |
          python - <<'PY'
          import sys
          import xml.etree.ElementTree as ET
          suite = ET.parse("verify.xml").getroot()
          suite = suite.find("testsuite") if suite.tag == "testsuites" else suite
          tests, skipped = int(suite.get("tests", 0)), int(suite.get("skipped", 0))
          print(f"{tests} tests, {skipped} skipped")
          sys.exit(0 if tests > 0 and skipped == 0 else 1)
          PY
