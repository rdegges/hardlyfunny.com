name: Links

# Fails when a link in the comic notes or About page is broken (404/410, dead
# domain). Links a script can't verify (bot-blocking sites, server hiccups) are
# reported as warnings on the run instead.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 14 * * 1"  # Mondays: links rot even when nothing is committed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version
      - run: python scripts/check_links.py
