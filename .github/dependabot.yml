version: 2
updates:
  # Workflows pin each action to a commit SHA with its tag in a comment; Dependabot moves both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # requirements.in / requirements-dev.in and their hash-pinned locks (Pillow, Jinja2, pytest). The site is built by Python.
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # package.json and package-lock.json (cf and wrangler: deploy tooling only).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
