version: 2
updates:
  # Workflows pin each action to a commit SHA with its tag in a comment; Dependabot moves both.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # requirements*.in and their hash-pinned locks (Pillow, Jinja2, pytest, pyoxipng). The locks are made by
  # `uv pip compile --universal`, so this is the uv ecosystem, not pip: its updater reruns `uv pip compile`
  # with the lock's own --universal, --generate-hashes and --python-version, which keeps the
  # Windows-only colorama pin. The pip ecosystem would run pip-tools instead and drop it.
  - package-ecosystem: uv
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # package.json and package-lock.json (cf and wrangler: deploy tooling only).
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
