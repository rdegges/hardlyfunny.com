<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hardly Funny · Classic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Patrick+Hand&family=Sniglet:wght@400;800&display=swap">
<style>
  /* Direction 1 — Classic.
     The xkcd reading experience, kept almost exactly: one comic, centered, a row of
     plain buttons above and below, permalink + image URL underneath. Everything that
     isn't the comic is quiet so her art and her lettering carry the page. */
  :root {
    color-scheme: light;
    --ground: #ffffff;
    --paper: #ffffff;
    --ink: #27232c;
    --muted: #6d6675;
    --line: #e6e1ea;
    --button: #ffffff;
    --button-hover: #f3fbe9;
    --green: #4f7f22;       /* her #669933 outline, darkened for text contrast */
    --lime: #ccff99;        /* logo fill */
    --pink: #ff66cc;        /* pixel heart */
    --purple: #cc66ff;      /* Samantha's dress */
    --shadow: 0 1px 0 rgba(39, 35, 44, .06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --ground: #19171c;
      --paper: #ffffff;
      --ink: #ece8f0;
      --muted: #a29aa9;
      --line: #322d37;
      --button: #221f26;
      --button-hover: #2b3323;
      --green: #b3e680;
      --shadow: 0 10px 30px rgba(0, 0, 0, .35);
    }
  }

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font: 400 17px/1.6 "Atkinson Hyperlegible", system-ui, sans-serif;
    padding: 0 16px;
  }
  a { color: var(--green); text-underline-offset: 3px; }
  a:hover { text-decoration-thickness: 2px; }
  :focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; border-radius: 6px; }

  .wrap { max-width: 760px; margin: 0 auto; }

  /* Header: her original 2011 banner, untouched. */
  header { padding-block: 24px 8px; text-align: center; }
  .logo { display: inline-block; max-width: 600px; width: 100%; }
  .logo img { display: block; width: 100%; height: auto; }
  .site-nav {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 4px 20px;
    margin-top: 6px;
    font: 400 20px/1.2 "Patrick Hand", "Comic Neue", cursive;
  }
  .site-nav a { color: var(--muted); text-decoration: none; }
  .site-nav a:hover, .site-nav a[aria-current="true"] { color: var(--ink); text-decoration: underline wavy var(--pink) 1.5px; }

  /* The comic block */
  main { padding-block: 12px 48px; }
  .comic-head { text-align: center; margin: 18px 0 14px; }
  .comic-title {
    font: 800 clamp(28px, 5vw, 38px)/1.1 "Sniglet", "Atkinson Hyperlegible", sans-serif;
    margin: 0;
    text-wrap: balance;
  }
  .comic-meta { color: var(--muted); font-size: 15px; margin-top: 4px; font-variant-numeric: tabular-nums; }

  .nav {
    list-style: none; margin: 0; padding: 0;
    display: flex; justify-content: center; flex-wrap: wrap; gap: 8px;
  }
  .nav button {
    font: 400 19px/1 "Patrick Hand", "Comic Neue", cursive;
    color: var(--ink);
    background: var(--button);
    border: 2px solid var(--ink);
    /* a slightly wobbly, hand-inked outline */
    border-radius: 14px 9px 12px 8px / 9px 13px 8px 12px;
    padding: 8px 14px 7px;
    min-width: 56px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--ink);
    transition: transform .08s ease, box-shadow .08s ease, background .15s;
  }
  .nav button:hover { background: var(--button-hover); }
  .nav button:active { transform: translate(2px, 2px); box-shadow: 0 0 0 var(--ink); }
  .nav button[disabled] { opacity: .35; cursor: default; box-shadow: none; }
  .nav .random { background: var(--lime); color: #27232c; border-color: #27232c; box-shadow: 2px 2px 0 #27232c; }
  .nav .random:hover { background: #bff080; }

  .comic {
    margin: 16px auto;
    text-align: center;
  }
  .comic img {
    display: block; margin: 0 auto 12px;
    max-width: 100%; height: auto;
    background: var(--paper);
    border-radius: 4px;
    box-shadow: var(--shadow);
  }
  .comic img:last-child { margin-bottom: 0; }

  /* The xkcd detail: permalink + hotlink URL, right under the strip. */
  .links {
    margin: 26px auto 0; max-width: 620px;
    font-size: 14px; color: var(--muted);
    display: grid; gap: 2px; text-align: center;
  }
  .links code {
    font: 13px/1.5 ui-monospace, "SFMono-Regular", Menlo, monospace;
    color: var(--ink); overflow-wrap: anywhere;
  }

  .note {
    margin: 40px auto 0; max-width: 620px;
    border-top: 2px dashed var(--line);
    padding-top: 24px;
    display: grid; grid-template-columns: 64px 1fr; gap: 0 16px; align-items: start;
  }
  .note img { width: 64px; height: auto; margin-top: 4px; }
  .note h2 { font: 400 22px/1.2 "Patrick Hand", cursive; margin: 0 0 4px; color: var(--muted); }
  .note-body p { margin: 0 0 12px; }
  .note-body:empty::before { content: "No note for this one. The comic speaks for itself."; color: var(--muted); font-style: italic; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; grid-column: 2; }
  .tags span {
    font-size: 13px; padding: 2px 10px; border-radius: 999px;
    border: 1px solid var(--line); color: var(--muted);
  }

  /* Archive: the xkcd archive is a plain list; this one is a thumbnail wall by year. */
  .archive { padding-block: 12px 48px; }
  .archive h2 { font: 800 30px/1.1 "Sniglet", sans-serif; text-align: center; margin: 18px 0 4px; }
  .archive > p { text-align: center; color: var(--muted); margin: 0 0 24px; }
  .year { margin-top: 28px; }
  .year h3 {
    font: 400 26px/1 "Patrick Hand", cursive; margin: 0 0 12px;
    display: flex; align-items: baseline; gap: 10px;
  }
  .year h3 small { font: 14px "Atkinson Hyperlegible", sans-serif; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 14px; }
  .grid a { color: inherit; text-decoration: none; display: grid; gap: 6px; }
  .grid img {
    width: 100%; height: auto; aspect-ratio: 1; object-fit: cover; object-position: top;
    background: var(--paper); border-radius: 6px; border: 2px solid var(--line);
    transition: border-color .15s, transform .15s;
  }
  .grid a:hover img { border-color: var(--pink); transform: rotate(-1deg); }
  .grid span { font-size: 14px; line-height: 1.3; }
  .grid small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }

  body[data-view="archive"] main, body:not([data-view="archive"]) .archive { display: none; }

  footer {
    border-top: 1px solid var(--line);
    padding-block: 24px 40px; text-align: center; color: var(--muted); font-size: 14px;
  }
  footer p { margin: 4px 0; }
  .kbd { font: 12px ui-monospace, Menlo, monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; }

  @media (max-width: 520px) {
    body { font-size: 16px; }
    .nav button { min-width: 0; padding: 8px 11px 7px; font-size: 17px; }
    .note { grid-template-columns: 1fr; }
    .note img { display: none; }
    .tags { grid-column: 1; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body data-view="comic">
<div class="wrap">
  <header>
    <a class="logo" href="#" data-nav="last" aria-label="Hardly Funny, latest comic">
      <img src="../archive/brand/banner.png" width="1000" height="280" alt="Hardly Funny: a webcomic about being married to a computer programmer">
    </a>
    <nav class="site-nav" aria-label="Site">
      <a href="#" data-view="archive">Archive</a>
      <a href="#" data-nav="random">Random</a>
      <a href="#about">About</a>
      <a href="#rss">RSS</a>
    </nav>
  </header>

  <main>
    <div class="comic-head">
      <h1 class="comic-title" id="title"></h1>
      <div class="comic-meta" id="meta"></div>
    </div>

    <ul class="nav" aria-label="Comic navigation">
      <li><button type="button" data-nav="first" aria-label="First comic">|&lt;</button></li>
      <li><button type="button" data-nav="prev">&lt; Prev</button></li>
      <li><button type="button" class="random" data-nav="random">Random</button></li>
      <li><button type="button" data-nav="next">Next &gt;</button></li>
      <li><button type="button" data-nav="last" aria-label="Latest comic">&gt;|</button></li>
    </ul>

    <figure class="comic" id="comic"></figure>

    <ul class="nav" aria-label="Comic navigation (bottom)">
      <li><button type="button" data-nav="first" aria-label="First comic">|&lt;</button></li>
      <li><button type="button" data-nav="prev">&lt; Prev</button></li>
      <li><button type="button" class="random" data-nav="random">Random</button></li>
      <li><button type="button" data-nav="next">Next &gt;</button></li>
      <li><button type="button" data-nav="last" aria-label="Latest comic">&gt;|</button></li>
    </ul>

    <div class="links">
      <div>Permanent link to this comic: <code id="permalink"></code></div>
      <div>Image URL (for hotlinking/embedding): <code id="imagelink"></code></div>
    </div>

    <section class="note" aria-labelledby="note-heading">
      <img src="../archive/brand/scribbles.png" width="122" height="85" alt="">
      <div>
        <h2 id="note-heading">Samantha says…</h2>
        <div class="note-body" id="note"></div>
      </div>
      <div class="tags" id="tags"></div>
    </section>
  </main>

  <section class="archive" aria-labelledby="archive-heading">
    <h2 id="archive-heading">The Archive</h2>
    <p id="archive-count"></p>
    <div id="archive"></div>
  </section>

  <footer>
    <p>Drawn by Samantha. Material provided, inadvertently, by Randall.</p>
    <p>In memory of Scribbles the chihuahua (2005–2014), who always took a side.</p>
    <p><span class="kbd">←</span> <span class="kbd">→</span> to read · <span class="kbd">r</span> random · <span class="kbd">a</span> archive</p>
  </footer>
</div>

<script src="../archive/comics.js"></script>
<script src="reader.js"></script>
<script>
  const $ = (id) => document.getElementById(id);
  HF.reader({
    render(c) {
      $("title").textContent = c.title;
      $("meta").textContent = `#${c.number} · ${HF.format.long(c.date)}`;
      $("comic").innerHTML = c.images.map((img) =>
        `<img src="${HF.src(img)}" width="${img.width}" height="${img.height}" alt="${HF.escapeHtml(c.title)}" title="${HF.escapeHtml(c.title)}">`).join("");
      $("permalink").textContent = `https://hardlyfunny.com/${c.number}/`;
      $("imagelink").textContent = `https://hardlyfunny.com/${c.images[0].src}`;
      $("note").innerHTML = c.note_html;
      $("tags").innerHTML = c.tags.map((t) => `<span>${HF.escapeHtml(t)}</span>`).join("");
      document.title = `Hardly Funny: ${c.title}`;
    },
    renderArchive(comics) {
      $("archive-count").textContent = `${comics.length} comics, August 2012 to January 2014.`;
      let html = "";
      for (const [year, items] of [...HF.byYear()].reverse()) {
        html += `<section class="year"><h3>${year} <small>${items.length} comics</small></h3><div class="grid">`;
        for (const { comic: c, index } of [...items].reverse()) {
          html += `<a href="#${c.number}" data-goto="${index}">
            <img src="${HF.src(c.images[0])}" alt="" loading="lazy" width="${c.images[0].width}" height="${c.images[0].height}">
            <span>${HF.escapeHtml(c.title)}</span><small>#${c.number} · ${HF.format.short(c.date)}</small></a>`;
        }
        html += `</div></section>`;
      }
      $("archive").innerHTML = html;
    },
  });
</script>
</body>
</html>
